name: Validate site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify page structure
        run: |
          test -s index.html
          grep -q '<html lang="he" dir="rtl">' index.html
          grep -q 'id="cards"' index.html
          grep -q 'id="player"' index.html
      - name: Syntax-check embedded JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/site.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site.js
