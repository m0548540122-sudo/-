name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and JavaScript files exist
        run: test -s index.html
      - name: Check document structure markers
        run: |
          grep -q '<html lang="he" dir="rtl">' index.html
          grep -q 'id="cards"' index.html
          grep -q 'function render()' index.html
